name: Validar sistema PHP

on:
  push:
    branches: [main]
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: pdo_sqlite
      - name: Validar sintaxe PHP
        run: find public src views -name '*.php' -print0 | xargs -0 -n1 php -l
      - name: Testar motor de cálculo
        run: php tests/TimeCalculatorTest.php
