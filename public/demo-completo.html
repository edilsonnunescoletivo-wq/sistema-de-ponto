<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Demo completo • Ponto Certo</title><link rel="stylesheet" href="/assets/app.css"></head><body><div class="app-shell"><aside class="sidebar"><a class="logo"><span class="brand-mark small">PC</span><span>Ponto <b>Certo</b></span></a><div class="company-picker"><small>ORGANIZAÇÃO</small><strong>Condomínio Demonstração</strong><span>00.000.000/0001-00</span></div><nav id="demoNav"></nav></aside><main class="main"><header class="topbar"><div><p class="eyebrow">DEMONSTRAÇÃO COMPLETA</p><h1 id="title">Visão geral</h1></div><button class="button primary" onclick="action('Nova operação')">+ Nova operação</button></header><section class="content" id="screen"></section></main></div><script>
const modules=['Visão geral','Colaboradores','Jornadas e escalas','Marcações','Tratamento','Relatórios','Empresas','Usuários','Auditoria','Configurações'];const nav=document.querySelector('#demoNav'),screen=document.querySelector('#screen');nav.innerHTML=modules.map((x,i)=>`<a class="${i?'':'active'}" onclick="show('${x}',this)"><span>${['▦','♙','◷','◎','✦','▤','▥','♙','◇','⚙'][i]}</span>${x}</a>`).join('');
const table=(items)=>`<article class="panel table-panel"><div class="table-wrap"><table><thead><tr><th>Registro</th><th>Detalhes</th><th>Status</th><th>Ação</th></tr></thead><tbody>${items.map(x=>`<tr><td><strong>${x[0]}</strong></td><td>${x[1]}</td><td><span class="badge ${x[2]=='Pendente'?'warning':'success'}">${x[2]}</span></td><td><button class="button ghost" onclick="action('Abrir ${x[0]}')">Abrir</button></td></tr>`).join('')}</tbody></table></div></article>`;
const cards=a=>`<div class="report-grid">${a.map(x=>`<article class="report-card"><span>▤</span><div><h2>${x}</h2><p>Período atual</p></div><button class="button primary" onclick="action('${x}')">Acessar</button></article>`).join('')}</div>`;
const data={'Colaboradores':[['Ana Souza','Administrativo • 08:00–17:00','Ativo'],['Carlos Lima','Portaria • 12×36','Ativo'],['Mariana Alves','Afastamento médico','Pendente']], 'Marcações':[['NSR 1003','Ana Souza • 17:06','Recebida'],['NSR 1004','Carlos Lima • 06:54','Recebida']], 'Tratamento':[['Marcação ímpar','Carlos Lima • falta saída','Pendente'],['Atraso','João Santos • 17 min','Pendente'],['Atestado','Mariana Alves • 2 dias','Pendente']], 'Auditoria':[['12/09 16:38','Período processado','Concluído'],['12/09 16:31','AFD importado','Concluído']]};
function show(name,el){document.querySelectorAll('#demoNav a').forEach(a=>a.classList.remove('active'));el?.classList.add('active');document.querySelector('#title').textContent=name;if(name==='Visão geral')screen.innerHTML=cards(['4 colaboradores','7 marcações hoje','3 inconsistências','Fechamento 78%']);else if(data[name])screen.innerHTML=`<div class="page-actions"><div><h2>${name}</h2><p>Dados demonstrativos</p></div><button class="button primary" onclick="action('Novo registro')">+ Novo</button></div>`+table(data[name]);else if(name==='Relatórios')screen.innerHTML=cards(['Espelho de ponto / PDF','Resumo da folha / CSV','Arquivo AEJ','Banco de horas','Horas extras','Fechar período']);else if(name==='Jornadas e escalas')screen.innerHTML=cards(['Administrativo • 08:00–17:00','Portaria • 12×36','Serviços gerais • 07:00–15:20']);else if(name==='Usuários')screen.innerHTML=table([['Administrador','Acesso total','Ativo'],['RH','Tratamento e fechamento','Ativo'],['Auditor','Somente leitura','Ativo']]);else screen.innerHTML=cards(name==='Configurações'?['Tolerância 10 min','Hora extra 50% / 100%','Adicional noturno 20%','Agente conectado']:['Condomínio Demonstração','Agente conectado']);}
function action(x){const n=document.createElement('div');n.className='alert success';n.textContent=x+': função demonstrada com sucesso.';screen.prepend(n)}show('Visão geral');
</script></body></html>
